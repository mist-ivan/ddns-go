<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="jeessy2" />
  <title>DDNS-GO</title>
  <meta name="color-scheme" content="light dark">
  <link class="theme" rel="stylesheet" type="text/css" href="./static/common.css" />
  <link rel="stylesheet" href="./static/bootstrap.min.css" />
  <link rel="stylesheet" href="./static/theme-button.css" />
  <script src="./static/constant.js"></script>
  <script src="./static/utils.js"></script>
  <script src="./static/i18n.js"></script>
  <script src="./static/tooltips.js"></script>
</head>

<body>
  <header>
    <div class="navbar navbar-dark bg-dark shadow-sm">
      <div class="button-container container d-flex justify-content-between align-items-center flex-wrap">
        <a target="blank" href="https://github.com/jeessy2/ddns-go" class="navbar-brand d-flex align-items-center">
          <strong>DDNS-GO</strong>
        </a>
        <div class="top-actions d-flex align-items-center flex-wrap ml-auto">
          <button data-i18n="Logs" class="btn btn-info btn-sm" id="logsBtn" data-toggle="tooltip" data-placement="bottom">
            Logs
          </button>
          <span class="theme-button gg-dark-mode" data-toggle="tooltip" data-placement="bottom" data-html="true"
            data-i18n-attr="title:themeTooltip" id="themeButton"></span>
          <span class="badge badge-secondary">{{.Version}}</span>
          <select class="action-button lang-select" id="langSelect" data-toggle="tooltip" data-placement="bottom"
            data-i18n-attr="title:languageSelectTooltip" aria-label="Language">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
          <a href="./logout" class="action-button action-button-text logout-button" data-i18n="Logout">
            Logout
          </a>
        </div>
      </div>
    </div>
  </header>

  <main role="main">
    <div id="mask" style="visibility: hidden"></div>
    <div class="row">
      <div class="col-md-10 offset-md-1">
        <div class="row" style="margin-top: 15px; margin-bottom: 15px">
          <div class="col-md-4 col-sm-12">
            <button data-i18n="Save" class="btn btn-primary submit_btn">Save</button>
          </div>

          <div class="col-md-8 col-sm-12" style="margin-left: auto; margin-right: 0">
            <form class="form-inline" style="margin-top: 5px">
              <label data-i18n="Config:" for="index" style="margin-left: auto">Config:</label>
              <select class="form-control form-control-sm" style="margin: 0 5px; width: 155px" name="Index"
                id="index"></select>
              <button data-i18n="Add" class="btn btn-primary btn-sm" id="addBtn">
                Add
              </button>
              <button data-i18n="Rename" class="btn btn-primary btn-sm" style="margin: 0 5px" id="renameBtn">
                Rename
              </button>
              <button data-i18n="Delete" class="btn btn-primary btn-sm" id="delBtn">
                Delete
              </button>
            </form>
          </div>
        </div>

        <form id="formDnsConf">
          <div class="portlet">
            <h5 data-i18n="DNS Provider" class="portlet__head" id="dnsProvider">DNS Provider</h5>
            <div class="portlet__body">
              <div class="form-group row">
                <label class="col-sm-3 col-form-label"></label>
                <div class="col-sm-9">
                  <div id="DnsSelector"></div>
                  <small id="dnsHelp" class="form-text text-muted">
                  </small>
                </div>
              </div>

              <div class="form-group row">
                <label for="DnsID" id="dnsIdLabel" class="col-sm-3 col-form-label">AccessKey ID</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="DnsID" id="DnsID" />
                </div>
              </div>

              <div class="form-group row">
                <label for="DnsSecret" id="dnsSecretLabel" class="col-sm-3 col-form-label">AccessKey Secret</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="DnsSecret" id="DnsSecret" />
                </div>
              </div>

              <div class="form-group row" id="DnsExtParamRow" style="display: none;">
                <label for="DnsExtParam" id="dnsExtParamLabel" class="col-sm-3 col-form-label">Team ID</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="DnsExtParam" id="DnsExtParam" placeholder="team_xxxxxx (可选)" />
                  <small class="form-text text-muted">
                    <span id="dnsExtParamHelp" data-i18n-html="extParamHelp">
                      可选项，如果您使用的是 Vercel 团队账户，请填写团队 ID
                    </span>
                  </small>
                </div>
              </div>

              <div class="form-group row">
                <label class="col-sm-3 col-form-label">TTL</label>
                <div class="col-sm-9">
                  <select class="form-control form" name="TTL" id="TTL" value="">
                    <option data-i18n="Auto" value="" selected>Auto</option>
                    <option data-i18n="1s" value="1">1s</option>
                    <option data-i18n="5s" value="5">5s</option>
                    <option data-i18n="10s" value="10">10s</option>
                    <option data-i18n="1m" value="60">1m</option>
                    <option data-i18n="2m" value="120">2m</option>
                    <option data-i18n="10m" value="600">10m</option>
                    <option data-i18n="30m" value="1800">30m</option>
                    <option data-i18n="1h" value="3600">1h</option>
                  </select>
                  <small data-i18n-html="ttlHelp" id="ttlHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Http Interface" for="HttpInterface" class="col-sm-3 col-form-label">Http Interface</label>
                <div class="col-sm-9">
                  <select class="form-control form" name="HttpInterface" id="HttpInterface">
                    <option data-i18n="Default" value="">Default</option>
                    {{range .AllInterfaces}}
                    <option value="{{.Name}}">{{.Name}}</option>
                    {{end}}
                  </select>
                  <small data-i18n-html="HttpInterfaceHelp" id="HttpInterfaceHelp" class="form-text text-muted"></small>
                </div>
              </div>
            </div>
          </div>

          <div class="portlet">
            <h5 class="portlet__head">IPv4</h5>
            <div class="portlet__body">
              <div class="form-group row">
                <label data-i18n="Enabled" for="Ipv4Enable" class="col-sm-3">Enabled</label>
                <div class="col-sm-9">
                  <input type="checkbox" class="form-check-inline" style="margin-top: 5px" id="Ipv4Enable"
                    name="Ipv4Enable" checked />
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Get IP method" for="Ipv4Url" class="col-sm-3 col-form-label">
                  Get IP method
                </label>
                <div class="col-sm-9">
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="Ipv4GetType" id="urlRadioIpv4" value="url"
                      checked />
                    <label data-i18n="By api" class="form-check-label" for="urlRadioIpv4">By api</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="Ipv4GetType" id="netInterfaceRadioIpv4"
                      value="netInterface" />
                    <label data-i18n="By network card" class="form-check-label" for="netInterfaceRadioIpv4">By network
                      card</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="Ipv4GetType" id="cmdRadioIpv4" value="cmd" />
                    <label data-i18n="By command" class="form-check-label" for="cmdRadioIpv4">By command</label>
                  </div>
                  <input type="url" class="form-control form" name="Ipv4Url" id="Ipv4Url" aria-describedby="Ipv4UrlHelp"
                    data-visible="url" />
                  <select class="form-control" id="Ipv4NetInterface" name="Ipv4NetInterface"
                    aria-describedby="Ipv4NetInterfaceHelp" data-visible="netInterface">
                    {{range .Ipv4}}
                    <option value="{{.Name}}">
                      {{.Name}}{{.Address}}
                    </option>
                    {{end}}
                  </select>
                  <input type="text" class="form-control form" id="Ipv4Cmd" name="Ipv4Cmd"
                    aria-describedby="Ipv4CmdHelp" data-visible="cmd" />
                  <small data-i18n-html="Ipv4UrlHelp" id="Ipv4UrlHelp" class="form-text text-muted"
                    data-visible="url"></small>
                  <small {{if len .Ipv4}} data-i18n-html="Ipv4NetInterfaceHelp" {{else}}
                    data-i18n-html="NetInterfaceEmptyHelp" {{end}} id="Ipv4NetInterfaceHelp"
                    class="form-text text-muted" data-visible="netInterface"></small>
                  <small data-i18n-html="Ipv4CmdHelp" id="Ipv4CmdHelp" class="form-text text-muted"
                    data-visible="cmd"></small>
                </div>
              </div>

              <div class="form-group row">
                <label for="Ipv4Domains" class="col-sm-3 col-form-label">Domains</label>
                <div class="col-sm-9">
                  <textarea class="form-control form" id="Ipv4Domains" name="Ipv4Domains" rows="3"
                    aria-describedby="ipv4DomainsHelp"></textarea>
                  <small data-i18n-html="domainsHelp" id="ipv4DomainsHelp" class="form-text text-muted"></small>
                </div>
              </div>
            </div>
          </div>

          <div class="portlet">
            <h5 class="portlet__head">IPv6</h5>
            <div class="portlet__body">
              <div class="form-group row">
                <label data-i18n="Enabled" for="Ipv6Enable" class="col-sm-3">Enabled</label>
                <div class="col-sm-9">
                  <input type="checkbox" class="form-check-inline" style="margin-top: 5px" id="Ipv6Enable"
                    name="Ipv6Enable" checked />
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Get IP method" for="Ipv6Url" class="col-sm-3 col-form-label">
                  Get IP method
                </label>
                <div class="col-sm-9">
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="Ipv6GetType" id="urlRadioIpv6" value="url"
                      checked />
                    <label data-i18n="By api" class="form-check-label" for="urlRadioIpv6">By api</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="Ipv6GetType" id="netInterfaceRadioIpv6"
                      value="netInterface" />
                    <label data-i18n="By network card" class="form-check-label" for="netInterfaceRadioIpv6">By network
                      card</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="Ipv6GetType" id="cmdRadioIpv6" value="cmd" />
                    <label data-i18n="By command" class="form-check-label" for="cmdRadioIpv6">By command</label>
                  </div>
                  <input type="url" class="form-control form" id="Ipv6Url" name="Ipv6Url" aria-describedby="Ipv6UrlHelp"
                    data-visible="url" />
                  <select class="form-control" id="Ipv6NetInterface" name="Ipv6NetInterface"
                    aria-describedby="Ipv6NetInterfaceHelp" data-visible="netInterface">
                    {{range .Ipv6}}
                    <option value="{{.Name}}">
                      {{.Name}}{{.Address}}
                    </option>
                    {{end}}
                  </select>
                  <input type="text" class="form-control form" id="Ipv6Cmd" name="Ipv6Cmd"
                    aria-describedby="Ipv6CmdHelp" data-visible="cmd" />
                  <small data-i18n-html="Ipv6UrlHelp" id="Ipv6UrlHelp" class="form-text text-muted"
                    data-visible="url"></small>
                  <small {{if len .Ipv6}} data-i18n-html="Ipv6NetInterfaceHelp" {{else}}
                    data-i18n-html="NetInterfaceEmptyHelp" {{end}} id="Ipv6NetInterfaceHelp"
                    class="form-text text-muted" data-visible="netInterface"></small>
                  <small data-i18n-html="Ipv6CmdHelp" id="Ipv6CmdHelp" class="form-text text-muted"
                    data-visible="cmd"></small>
                </div>
              </div>

              <div class="form-group row" id="Ipv6RegDiv" data-visible="netInterface" style="display: none">
                <label data-i18n="Regular exp." for="Ipv6Reg" class="col-sm-3 col-form-label">Regular exp.</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="Ipv6Reg" id="Ipv6Reg" aria-describedby="Ipv6RegHelp" />
                  <small data-i18n-html="regHelp" id="Ipv6RegHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label for="Ipv6Domains" class="col-sm-3 col-form-label">Domains</label>
                <div class="col-sm-9">
                  <textarea class="form-control form" id="Ipv6Domains" name="Ipv6Domains" rows="3"
                    aria-describedby="ipv6_domainsHelp"></textarea>
                  <small data-i18n-html="domainsHelp" id="ipv6_domainsHelp" class="form-text text-muted"></small>
                </div>
              </div>
            </div>
          </div>
        </form>

        <form id="formGlobal">
          <div class="portlet">
            <h5 data-i18n="Others" class="portlet__head">Others</h5>
            <div class="portlet__body">
              <div class="form-group row">
                <label data-i18n="Deny from WAN" for="NotAllowWanAccess" class="col-sm-3 col-form-label">Deny from
                  WAN</label>
                <div class="col-sm-9">
                  <input type="checkbox" class="form-check-inline" style="margin-top: 5px" id="NotAllowWanAccess"
                    name="NotAllowWanAccess" {{if .NotAllowWanAccess}}checked{{end}} />
                  <small data-i18n-html="NotAllowWanAccessHelp" id="NotAllowWanAccessHelp"
                    class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Username" for="Username" class="col-sm-3 col-form-label">Username</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="Username" id="Username" value="{{.Username}}"
                    autocomplete="username" aria-describedby="UsernameHelp" />
                  <small data-i18n-html="accountHelp" id="UsernameHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Password" for="Password" class="col-sm-3 col-form-label">Password</label>
                <div class="col-sm-9">
                  <input class="form-control form" type="password" name="Password" id="Password"
                    autocomplete="new-password" aria-describedby="passwordHelp" />
                  <small data-i18n-html="passwordHelp" id="passwordHelp" class="form-text text-muted"></small>
                </div>
              </div>
            </div>
          </div>

          <div class="portlet">
            <h5 class="portlet__head">Webhook</h5>
            <div class="portlet__body">
              <div class="form-group row">
                <label for="WebhookURL" class="col-sm-3 col-form-label">URL</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="WebhookURL" id="WebhookURL" value="{{.WebhookURL}}"
                    aria-describedby="WebhookURLHelp" />
                  <small data-i18n-html="WebhookURLHelp" id="WebhookURLHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label for="WebhookRequestBody" class="col-sm-3 col-form-label">RequestBody</label>
                <div class="col-sm-9">
                  <textarea class="form-control form" id="WebhookRequestBody" name="WebhookRequestBody" rows="3"
                    aria-describedby="WebhookRequestBodyHelp">{{.WebhookRequestBody}}</textarea>
                  <small data-i18n-html="WebhookRequestBodyHelp" id="WebhookRequestBodyHelp"
                    class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label for="WebhookHeaders" class="col-sm-3 col-form-label">Headers</label>
                <div class="col-sm-9">
                  <textarea class="form-control form" id="WebhookHeaders" name="WebhookHeaders" rows="1"
                    aria-describedby="WebhookHeadersHelp">{{.WebhookHeaders}}</textarea>
                  <small data-i18n-html="WebhookHeadersHelp" id="WebhookHeadersHelp"
                    class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label class="col-sm-3 col-form-label"></label>
                <div class="col-sm-9">
                  <button data-i18n="Try it" class="webhook-button btn btn-primary btn-sm" id="webhookTestBtn"
                    data-toggle="tooltip" data-i18n-attr="title:webhookTestTooltip">
                    Try it
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="portlet">
            <h5 data-i18n="Email Notification" class="portlet__head">Email Notification</h5>
            <div class="portlet__body">
              <div class="form-group row">
                <label data-i18n="Enable Email" for="EmailEnable" class="col-sm-3 col-form-label">Enable Email</label>
                <div class="col-sm-9">
                  <input type="checkbox" class="form-check-inline" style="margin-top: 5px" id="EmailEnable"
                    name="EmailEnable" {{if .Email.Enable}}checked{{end}} />
                  <small data-i18n-html="EmailEnableHelp" id="EmailEnableHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="SMTP Server" for="EmailSMTPHost" class="col-sm-3 col-form-label">SMTP Server</label>
                <div class="col-sm-9">
                  <div class="input-group">
                    <input class="form-control form" name="EmailSMTPHost" id="EmailSMTPHost" value="{{.Email.SMTPHost}}"
                      placeholder="smtp.qq.com" aria-describedby="EmailSMTPHelp" />
                    <input class="form-control form" name="EmailSMTPPort" id="EmailSMTPPort"
                      value="{{if .Email.SMTPPort}}{{.Email.SMTPPort}}{{else}}465{{end}}" placeholder="465"
                      style="max-width: 100px" />
                  </div>
                  <small data-i18n-html="EmailSMTPHelp" id="EmailSMTPHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Encryption" for="EmailEncrypt" class="col-sm-3 col-form-label">Encryption</label>
                <div class="col-sm-9">
                  <select class="form-control form" name="EmailEncrypt" id="EmailEncrypt">
                    <option value="ssl" {{if or (eq .Email.Encrypt "ssl") (and (eq .Email.Encrypt "") (ne .Email.SMTPPort 587) (ne .Email.SMTPPort 25))}}selected{{end}}>SSL / 隐式 TLS (465)
                    </option>
                    <option value="starttls" {{if or (eq .Email.Encrypt "starttls") (and (eq .Email.Encrypt "") (eq .Email.SMTPPort 587))}}selected{{end}}>STARTTLS (587)</option>
                    <option value="none" {{if or (eq .Email.Encrypt "none") (and (eq .Email.Encrypt "") (eq .Email.SMTPPort 25))}}selected{{end}}>None / 不加密 (25)</option>
                  </select>
                  <small data-i18n-html="EmailEncryptHelp" id="EmailEncryptHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="SMTP Username" for="EmailUsername" class="col-sm-3 col-form-label">SMTP
                  Username</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="EmailUsername" id="EmailUsername" value="{{.Email.Username}}"
                    placeholder="you@example.com" autocomplete="off" aria-describedby="EmailAuthHelp" />
                  <small data-i18n-html="EmailAuthHelp" id="EmailAuthHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="SMTP Password" for="EmailPassword" class="col-sm-3 col-form-label">SMTP
                  Password</label>
                <div class="col-sm-9">
                  <input class="form-control form" type="password" name="EmailPassword" id="EmailPassword"
                    autocomplete="new-password"
                    {{if .Email.Password}}data-password-saved="1"{{end}} />
                  <small data-i18n-html="EmailPasswordHelp" id="EmailPasswordHelp"
                    class="form-text text-muted"></small>
                  {{if .Email.Password}}
                  <button type="button" class="btn btn-outline-danger btn-sm mt-1" id="emailClearPwdBtn">
                    <span data-i18n="Clear saved password">Clear saved password</span>
                  </button>
                  <small class="form-text text-muted" id="emailClearPwdHint"></small>
                  {{end}}
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="From" for="EmailFrom" class="col-sm-3 col-form-label">From</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="EmailFrom" id="EmailFrom" value="{{.Email.From}}"
                    placeholder="ddns-go <you@example.com>" aria-describedby="EmailFromHelp" />
                  <small data-i18n-html="EmailFromHelp" id="EmailFromHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="To" for="EmailTo" class="col-sm-3 col-form-label">To</label>
                <div class="col-sm-9">
                  <input class="form-control form" name="EmailTo" id="EmailTo" value="{{.Email.To}}"
                    placeholder="a@example.com, b@example.com" aria-describedby="EmailToHelp" />
                  <small data-i18n-html="EmailToHelp" id="EmailToHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Notify on start" for="EmailOnStart" class="col-sm-3 col-form-label">Notify on
                  start</label>
                <div class="col-sm-9">
                  <input type="checkbox" class="form-check-inline" style="margin-top: 5px" id="EmailOnStart"
                    name="EmailOnStart" {{if .Email.OnStart}}checked{{end}} />
                  <small data-i18n-html="EmailOnStartHelp" id="EmailOnStartHelp" class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Alert on fetch failure" for="EmailAlertOnFetchFailure"
                  class="col-sm-3 col-form-label">Alert on fetch failure</label>
                <div class="col-sm-9">
                  <input type="checkbox" class="form-check-inline" style="margin-top: 5px"
                    id="EmailAlertOnFetchFailure" name="EmailAlertOnFetchFailure"
                    {{if .Email.AlertOnFetchFailure}}checked{{end}} />
                  <small data-i18n-html="EmailAlertOnFetchHelp" id="EmailAlertOnFetchHelp"
                    class="form-text text-muted"></small>
                </div>
              </div>

              <div class="form-group row">
                <label class="col-sm-3 col-form-label"></label>
                <div class="col-sm-9">
                  <button data-i18n="Send test email" type="button" class="btn btn-primary btn-sm" id="emailTestBtn">
                    Send test email
                  </button>
                  <small class="form-text text-muted" id="emailTestResult"></small>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="Status" class="col-sm-3 col-form-label">Status</label>
                <div class="col-sm-9">
                  <div class="form-text text-muted" id="emailStatus">
                    <span data-i18n="Loading status...">Loading status...</span>
                  </div>
                </div>
              </div>

              <div class="form-group row">
                <label data-i18n="History" class="col-sm-3 col-form-label">History</label>
                <div class="col-sm-9">
                  <div class="form-text text-muted" id="emailHistory">
                    <span data-i18n="No history yet">No history yet</span>
                  </div>
                  <button type="button" class="btn btn-outline-secondary btn-sm" id="emailRefreshBtn">
                    <span data-i18n="Refresh">Refresh</span>
                  </button>
                  <button type="button" class="btn btn-outline-danger btn-sm" id="emailClearHistoryBtn">
                    <span data-i18n="Clear history">Clear history</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>

<!-- 配置项 -->
<script>
  // 不需要填充到表单中的字段
  const SKIPPED_NAMES = ["Name"];

  // 把dnsConf中的值填充到表单中
  function showConf(idx) {
    const conf = dnsConf[idx] ?? {};
    for (const name in conf) {
      if (SKIPPED_NAMES.includes(name)) {
        continue;
      }

      const $e = document.querySelector(`[name=${name}]`);
      // 判断对应input的类型
      switch ($e.getAttribute("type")) {
        case "checkbox":
          $e.checked = conf[name];
          break;
        case "radio":
          document.querySelector(`[name=${name}][value=${conf[name]}]`).click();
          break;
        default:
          //特殊处理select类型，要保证option存在，否则取第一个option
          if ($e.tagName === "SELECT" &&
            $e.querySelector(`option[value="${conf[name]}"]`) === null) {
            $e.value = $e.querySelector("option")?.value;
            conf[name] = $e.value || "";
          }
          // 如果是其它类型的input或者不是input（如textarea），都使用value赋值
          $e.value = conf[name];
          break;
      }
    }
    // 根据 DNS 提供商显示或隐藏扩展参数输入框
    const $dnsExtParamRow = document.getElementById("DnsExtParamRow");
    const $dnsExtParamLabel = document.getElementById("dnsExtParamLabel");
    const $dnsExtParamHelp = document.getElementById("dnsExtParamHelp");
    const dnsInfo = DNS_PROVIDERS[conf.DnsName];
    if (dnsInfo && dnsInfo.extParamLabel) {
      $dnsExtParamRow.style.display = "";
      $dnsExtParamLabel.innerHTML = dnsInfo.extParamLabel;
      $dnsExtParamHelp.innerHTML = i18n(dnsInfo.extParamHelpHtml);
    } else {
      $dnsExtParamRow.style.display = "none";
    }
  }

  // 从json中重新加载配置
  function reloadConf(jsonConf) {
    try {
      dnsConf = JSON.parse(jsonConf);
      if (dnsConf.length === 0) {
        console.warn("dnsConf is empty, add defaultDnsConf");
        dnsConf.push({ ...defaultDnsConf });
      }
    } catch (e) {
      alert("error: " + e.toString());
      return;
    }

    // Reload all configs in dnsConf into index
    const $index = document.getElementById("index");
    $index.innerHTML = "";
    for (let i = 0; i < dnsConf.length; i++) {
      appendConfigToIndex(i);
    }
    // 负数表示倒数第几个
    if (configIndex < 0) {
      configIndex += dnsConf.length;
    } else {
      configIndex = Math.min(configIndex, dnsConf.length - 1);
    }
    $index.value = configIndex;
    showConf(configIndex);
  }

  // 拼接新的配置项到下拉菜单
  function appendConfigToIndex(idx) {
    const $index = document.getElementById('index');

    const $option = html2Element(`
        <option id="index_${idx}" value="${idx}">
          ${getConfName(idx)}
        </option>`);
    $index.append($option);
  }

  // 获取配置名称或生成默认名称
  function getConfName(idx, _default) {
    const conf = dnsConf[idx];
    if (!conf) {
      // 该位置已被删除（数组里是 null），返回占位名，避免读取 .DnsName 抛错
      return `${idx + 1} - ` + i18n({ "en": "Deleted", "zh-cn": "已删除" });
    }
    return conf.Name || `${idx + 1} - ${_default ?? conf.DnsName}`;
  }

  const $langSelect = document.getElementById("langSelect");
  $langSelect.value = globalConf.Lang === "zh" || globalConf.Lang === "zh-cn" ? "zh" : "en";
  $langSelect.addEventListener('change', async () => {
    const previousLang = globalConf.Lang === "zh" || globalConf.Lang === "zh-cn" ? "zh" : "en";
    const nextLang = $langSelect.value;
    $langSelect.disabled = true;
    try {
      const resp = await request.post("./setLang", { Lang: nextLang });
      if (resp.result !== "ok") {
        $langSelect.value = previousLang;
        showMessage({
          content: friendlyError(resp.result),
          type: "error",
          duration: 5000,
        });
        return;
      }
      globalConf.Lang = resp.lang;
      localStorage.setItem('lang', resp.lang);
      window.location.reload();
    } catch (err) {
      $langSelect.value = previousLang;
      showMessage({
        content: friendlyError(err),
        type: "error",
        duration: 5000,
      });
    } finally {
      $langSelect.disabled = false;
    }
  });

  // 新增配置按钮被点击
  document.getElementById("addBtn").addEventListener('click', e => {
    e.preventDefault();
    configIndex = dnsConf.length;
    dnsConf[configIndex] = { ...defaultDnsConf };

    // 创建新的option
    appendConfigToIndex(configIndex);

    document.getElementById("index").value = configIndex;
    showConf(configIndex);
  });

  // 重命名配置按钮被点击
  document.getElementById("renameBtn").addEventListener('click', e => {
    e.preventDefault();

    const newName = prompt(i18n("RenameHelp"));
    if (newName) {
      dnsConf[configIndex].Name = newName;
      document.getElementById(`index_${configIndex}`).textContent = newName;
    }
  });

  // 删除配置按钮被点击
  document.getElementById("delBtn").addEventListener('click', e => {
    e.preventDefault();
    if (configIndex < 0 || !dnsConf[configIndex]) {
      return;
    }

    const confName = getConfName(configIndex);
    if (!confirm(i18n({
      "en": `Delete config "${confName}"? It only takes effect after you save; reload the page to undo.`,
      "zh-cn": `确定删除配置「${confName}」吗？保存后才真正生效，未保存前刷新页面可以撤销。`,
    }))) {
      return;
    }

    const $index = document.getElementById("index");
    dnsConf[configIndex] = null;
    if ($index.options[configIndex]) {
      $index.options[configIndex].disabled = true;
      $index.options[configIndex].text =
        configIndex + 1 + i18n({ "en": " - Deleted", "zh-cn": " - 已删除" });
    }

    // 优先选后一个配置，没有就往前找。
    // 原实现只往前找，删掉第一个时会一路走到 -1，误触发下面的“新增配置”。
    let next = -1;
    for (let i = configIndex + 1; i < dnsConf.length; i++) {
      if (dnsConf[i]) {
        next = i;
        break;
      }
    }
    if (next < 0) {
      for (let i = configIndex - 1; i >= 0; i--) {
        if (dnsConf[i]) {
          next = i;
          break;
        }
      }
    }

    if (next >= 0) {
      configIndex = next;
      $index.value = next;
      showConf(next);
      return;
    }

    // 全部删光：清空下拉与数组，重新给一个空白配置
    dnsConf = [];
    $index.innerHTML = "";
    document.getElementById("addBtn").click();
  });

  // 保存配置按钮被点击
  document.querySelectorAll(".submit_btn").forEach($el => {
    $el.addEventListener('click', async e => {
      e.preventDefault();
      // 如果没有idLabel，删除DnsID
      if (!DNS_PROVIDERS[dnsConf[configIndex].DnsName].idLabel) {
        dnsConf[configIndex].DnsID = "";
      }
      try {
        const resp = await request.post("./save", {
          ...globalConf,
          DnsConf: dnsConf
        });
        if (resp.result !== "ok") {
          showMessage({
            content: friendlyError(resp.result),
            type: "error",
            duration: 5000,
          });
        } else {
          globalConf.EmailPasswordClear = false;
          showMessage({
            content: i18n({
              "en": "Successfully saved",
              "zh-cn": "保存成功",
            }),
            type: "success",
            duration: 1500,
          });
          reloadConf(resp.dnsConf);
          // 保存后配置/密码可能变化，立刻刷新一次状态面板与历史
          if (typeof refreshEmailPanel === "function") {
            globalConf.EmailPasswordClear = false;
            refreshEmailPanel();
          }
        }
      } catch (err) {
        alert(friendlyError(err));
      }
    });
  });

  // 切换配置项
  document.getElementById("index").addEventListener('change', e => {
    configIndex = parseInt(e.target.value);
    showConf(configIndex);
  });

  // 初始化dnsConf
  reloadConf("{{.DnsConf}}");
</script>

<script>
  // 获取日志
  const getLogs = async (loop = false) => {
    let logsList = [];
    try {
      const resp = await request.get("./logs");
      // 如果不是数组，说明返回的是错误信息
      if (!Array.isArray(resp)) {
        throw new Error(resp);
      }
      logsList = resp;
    } catch (err) {
      showMessage({
        content: friendlyError(err),
        type: "error",
        duration: 5000,
      });
      return;
    } finally {
      if (loop) {
        setTimeout(getLogs, 5 * 1000, true);
      }
    }
    const $logs = document.getElementById("logs");
    // 判断滚动条是否在底部
    const isBottom = $logs.scrollHeight - $logs.scrollTop - $logs.clientHeight < 10;
    $logs.value = logsList.join("");
    // 如果滚动条原先在底部，滚动到底部
    if (isBottom) {
      $logs.scrollTop = $logs.scrollHeight;
    }
    const oldLogItem = localStorage.getItem("logItem") || "";
    localStorage.setItem(
      "logItem",
      logsList[logsList.length - 1] || ""
    );
    // 计算日志更新部分
    const newLogsList = logsList.slice(
      // 如果oldLogItem出现多次，使用indexOf会得到第一次出现的位置导致一直判定为有新日志，所以这里使用lastIndexOf
      logsList.lastIndexOf(oldLogItem) + 1
    );
    // 如果日志面板可见或者没有新增日志，则不显示
    if (
      !newLogsList.length ||
      document.getElementById("logs-panel").style.visibility !== "hidden"
    ) {
      return;
    }
    const $logsBtn = document.getElementById("logsBtn");
    $logsBtn.classList.add("unread");
    $logsBtn.dataset.title = i18n({
      "en": `${newLogsList.length} new logs`,
      "zh-cn": `新增${newLogsList.length}条日志`,
    });
    // 如果新增日志行数小于等于3，则message显示新增日志，否则显示最后2行并提示剩余行数
    if (newLogsList.length <= 3) {
      for (const line of newLogsList) {
        showMessage({
          type: "info",
          content: line,
        });
        await delay(800);
      }
    } else {
      showMessage({
        type: "info",
        content: i18n({
          "en": `Please check the previous ${newLogsList.length - 2} logs by yourself`,
          "zh-cn": `前${newLogsList.length - 2}条日志请自行查看`,
        })
      });
      for (const line of newLogsList.slice(-2)) {
        showMessage({
          type: "info",
          content: line,
        });
        await delay(800);
      }
    }
  }

  // 清空日志
  document.getElementById("clearLogBtn").addEventListener('click', async e => {
    e.preventDefault();
    try {
      await request.get("./clearLog");
      getLogs();
    } catch (err) {
      showMessage({
        content: friendlyError(err),
        type: "error",
        duration: 5000,
      });
    }
  });

  // 显示/隐藏日志面板
  document.querySelectorAll('#logsBtn, #closeLogBtn, #mask').forEach($el => {
    $el.addEventListener('click', () => {
      // 取消未读标记
      const $logsBtn = document.getElementById("logsBtn");
      $logsBtn.classList.remove("unread");
      $logsBtn.dataset.title = ""
      if (document.getElementById("logs-panel").style.visibility === "hidden") {
        document.getElementById("logs-panel").style.visibility = "";
        document.getElementById("mask").style.visibility = "";
      } else {
        document.getElementById("logs-panel").style.visibility = "hidden";
        document.getElementById("mask").style.visibility = "hidden";
      }
    });
  });

  // 页面加载完成后定时获取日志
  document.addEventListener('DOMContentLoaded', () => getLogs(true));
</script>

<script>
  // 模拟测试webhook
  document.getElementById("webhookTestBtn").addEventListener('click', async e => {
    e.preventDefault();
    try {
      await request.post("./webhookTest", {
        URL: globalConf.WebhookURL,
        RequestBody: globalConf.WebhookRequestBody,
        Headers: globalConf.WebhookHeaders,
      });
      showMessage({
        content: i18n({
          "en": "Submit simulation test successfully! The data is fake data, just to test whether the Webhook is normal or not",
          "zh-cn": "提交模拟测试成功! 数据为假数据, 只是为了测试Webhook正常与否",
        }),
        type: "success",
      });
    } catch (err) {
      showMessage({
        content: friendlyError(err),
        type: "error",
        duration: 5000,
      });
    }
  });

  // 把后端/网关返回的内容清洗成一行可读的错误信息
  // （接口 502/504 时可能返回整页 HTML，直接塞进提示条会糊满屏幕）
  function friendlyError(raw) {
    let msg = String(raw === undefined || raw === null ? "" : raw);
    const title = msg.match(/<title>([^<]*)<\/title>/i) || msg.match(/<h1>([^<]*)<\/h1>/i);
    if (title) {
      msg = title[1];
    } else {
      msg = msg.replace(/<[^>]*>/g, " ");
    }
    msg = msg.replace(/\s+/g, " ").trim();
    if (msg.length > 200) {
      msg = msg.slice(0, 200) + "…";
    }
    return msg || i18n({ "en": "Request failed", "zh-cn": "请求失败" });
  }

  // 相对时间：刚刚 / N 分钟前 / N 小时前
  function relativeTime(unixSeconds) {
    if (!unixSeconds) return i18n({ "en": "never", "zh-cn": "从未" });
    const diff = Math.max(0, Math.floor(Date.now() / 1000) - unixSeconds);
    if (diff < 60) return i18n({ "en": "just now", "zh-cn": "刚刚" });
    if (diff < 3600) {
      return i18n({ "en": Math.floor(diff / 60) + " min ago", "zh-cn": Math.floor(diff / 60) + " 分钟前" });
    }
    if (diff < 86400) {
      return i18n({ "en": Math.floor(diff / 3600) + " h ago", "zh-cn": Math.floor(diff / 3600) + " 小时前" });
    }
    return i18n({ "en": Math.floor(diff / 86400) + " d ago", "zh-cn": Math.floor(diff / 86400) + " 天前" });
  }

  function absoluteTime(unixSeconds) {
    if (!unixSeconds) return "-";
    const d = new Date(unixSeconds * 1000);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  // 直到下次检测的倒计时（秒）
  function secondsToNextCheck(status) {
    if (!status.lastRunAt || !status.intervalSeconds) return null;
    return status.lastRunAt + status.intervalSeconds - Math.floor(Date.now() / 1000);
  }

  const BADGE_STYLE = {
    change: "background:#1f6feb;color:#fff",
    baseline: "background:#6e7681;color:#fff",
    fetch_failed: "background:#b62324;color:#fff",
    recovered: "background:#1a7f37;color:#fff",
  };

  const KIND_LABEL = {
    baseline: { "en": "baseline", "zh-cn": "首次基线" },
    change: { "en": "IP changed", "zh-cn": "IP 变更" },
    fetch_failed: { "en": "fetch failed", "zh-cn": "获取失败" },
    recovered: { "en": "recovered", "zh-cn": "获取已恢复" },
  };

  function kindText(kind) {
    const label = KIND_LABEL[kind];
    return label ? i18n(label) : kind;
  }

  function kindBadge(entry) {
    const style = BADGE_STYLE[entry.kind] || "background:#6e7681;color:#fff";
    return `<span style="display:inline-block;padding:0 6px;border-radius:3px;font-size:12px;${style}">${kindText(entry.kind)}</span>`;
  }

  let emailStatusCache = null;
  let emailStatusTimer = null;

  function renderEmailStatus(status) {
    const el = document.getElementById("emailStatus");
    if (!el) return;
    const lines = [];
    // 区分"本轮实际检测到的 IP"和"上次成功通知的 IP"：
    // 发信失败或只有告警时，后者会停留在旧值，直接标成"当前 IP"会误导。
    const detectedText = [status.detectedIpv4, status.detectedIpv6].filter(Boolean).join(" / ") ||
      i18n({ "en": "not yet detected", "zh-cn": "尚未检测到" });
    lines.push(`<div><strong>${i18n({ "en": "Detected IP", "zh-cn": "本轮检测 IP" })}:</strong> ${detectedText}</div>`);

    const notifiedText = [status.ipv4, status.ipv6].filter(Boolean).join(" / ") ||
      i18n({ "en": "none yet", "zh-cn": "尚无" });
    lines.push(`<div><strong>${i18n({ "en": "Last notified IP", "zh-cn": "上次通知的 IP" })}:</strong> ${notifiedText}</div>`);

    const lastCheck = status.lastRunAt
      ? `${absoluteTime(status.lastRunAt)}（${relativeTime(status.lastRunAt)}）`
      : i18n({ "en": "not yet run", "zh-cn": "尚未执行" });
    lines.push(`<div><strong>${i18n({ "en": "Last check", "zh-cn": "上次检测" })}:</strong> ${lastCheck}</div>`);

    const left = secondsToNextCheck(status);
    if (left !== null) {
      const text = left > 0
        ? i18n({ "en": `in ${left}s`, "zh-cn": `${left} 秒后` })
        : i18n({ "en": "due now", "zh-cn": "即将执行" });
      lines.push(`<div><strong>${i18n({ "en": "Next check", "zh-cn": "下次检测" })}:</strong> ${text}` +
        ` <span class="text-muted">(${i18n({ "en": "every", "zh-cn": "每" })} ${status.intervalSeconds}s)</span></div>`);
    }

    const lastMail = status.lastSent
      ? `${absoluteTime(status.lastSent)}（${relativeTime(status.lastSent)}）`
      : i18n({ "en": "no email sent yet", "zh-cn": "尚未发送过邮件" });
    lines.push(`<div><strong>${i18n({ "en": "Last notification", "zh-cn": "上次通知" })}:</strong> ${lastMail}</div>`);

    lines.push(`<div><strong>${i18n({ "en": "Total records", "zh-cn": "历史记录" })}:</strong> ${status.historyTotal}</div>`);

    if (!status.emailEnabled) {
      lines.push(`<div class="text-warning">${i18n({ "en": "Email notification is disabled", "zh-cn": "邮件通知当前未启用" })}</div>`);
    }
    el.innerHTML = lines.join("");
  }

  function renderEmailHistory(status) {
    const el = document.getElementById("emailHistory");
    if (!el) return;
    const recent = (status && status.recent) || [];
    if (!recent.length) {
      el.innerHTML = `<span>${i18n({ "en": "No history yet", "zh-cn": "暂无通知记录" })}</span>`;
      return;
    }
    const items = recent.map((entry) => {
      const ip = entry.ipv4
        ? ` · IPv4 ${entry.ipv4}${entry.prevIpv4 ? " ← " + entry.prevIpv4 : ""}`
        : (entry.ipv6 ? ` · IPv6 ${entry.ipv6}${entry.prevIpv6 ? " ← " + entry.prevIpv6 : ""}` : "");
      return `<li style="margin:2px 0">${absoluteTime(entry.time)} ${kindBadge(entry)}${ip}</li>`;
    }).join("");
    el.innerHTML = `<ul class="mb-1" style="padding-left:1.2em">${items}</ul>`;
  }

  async function refreshEmailPanel() {
    try {
      const status = await request.get("./emailStatus");
      if (!status || typeof status !== "object" || status.Code) {
        throw new Error(friendlyError(status && status.Msg ? status.Msg : "emailStatus 返回异常"));
      }
      emailStatusCache = status;
      renderEmailStatus(status);
      renderEmailHistory(status);
    } catch (err) {
      const el = document.getElementById("emailStatus");
      if (el) el.innerHTML = `<span class="text-danger">${friendlyError(err)}</span>`;
    }
  }

  // 每 5 秒刷新状态面板（倒计时需要每秒更新，状态数据 5 秒拉一次）
  function startEmailStatusPolling() {
    refreshEmailPanel();
    if (emailStatusTimer) clearInterval(emailStatusTimer);
    let tick = 0;
    emailStatusTimer = setInterval(() => {
      if (emailStatusCache) renderEmailStatus(emailStatusCache);
      if (++tick % 5 === 0) refreshEmailPanel();
    }, 1000);
  }

  const $emailRefresh = document.getElementById("emailRefreshBtn");
  if ($emailRefresh) {
    $emailRefresh.addEventListener('click', async (e) => {
      e.preventDefault();
      await refreshEmailPanel();
    });
  }

  // 密码框：输入新密码即视为"不删除"，撤销之前的清除标记
  const $emailPassword = document.getElementById("EmailPassword");
  if ($emailPassword) {
    $emailPassword.addEventListener('input', () => {
      if ($emailPassword.value) {
        globalConf.EmailPasswordClear = false;
        const $hint = document.getElementById("emailClearPwdHint");
        if ($hint) $hint.textContent = "";
      }
    });
    if ($emailPassword.dataset.passwordSaved === "1") {
      $emailPassword.placeholder = i18n({
        "en": "saved — leave blank to keep it",
        "zh-cn": "已保存，留空表示不修改",
      });
    }
  }

  const $emailClearPwd = document.getElementById("emailClearPwdBtn");
  if ($emailClearPwd) {
    $emailClearPwd.addEventListener('click', (e) => {
      e.preventDefault();
      if (!confirm(i18n({
        "en": "Clear the saved SMTP password? It takes effect after you save.",
        "zh-cn": "确定清除已保存的 SMTP 密码吗？保存后生效。",
      }))) return;
      globalConf.EmailPasswordClear = true;
      const $hint = document.getElementById("emailClearPwdHint");
      if ($hint) $hint.textContent = i18n({ "en": "will be cleared on save", "zh-cn": "保存后将清除" });
    });
  }

  const $emailClear = document.getElementById("emailClearHistoryBtn");
  if ($emailClear) {
    $emailClear.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!confirm(i18n({
        "en": "Clear all notification history?",
        "zh-cn": "确定要清空全部通知历史吗？",
      }))) return;
      try {
        const resp = await request.post("./emailHistoryClear", {});
        if (resp && resp.ok) {
          showMessage({
            content: i18n({ "en": "History cleared", "zh-cn": "历史记录已清空" }),
            type: "success",
          });
          await refreshEmailPanel();
        } else {
          showMessage({
            content: friendlyError(resp && resp.msg ? resp.msg : resp),
            type: "error",
            duration: 6000,
          });
        }
      } catch (err) {
        showMessage({ content: friendlyError(err), type: "error", duration: 6000 });
      }
    });
  }

  startEmailStatusPolling();

  // 发送测试邮件
  document.getElementById("emailTestBtn").addEventListener('click', async e => {
    e.preventDefault();
    const $btn = e.target;
    const $result = document.getElementById("emailTestResult");
    $btn.disabled = true;
    if ($result) $result.textContent = i18n({ "en": "sending…", "zh-cn": "发送中…" });
    try {
      const resp = await request.post("./emailTest", {
        Enable: globalConf.EmailEnable,
        SMTPHost: globalConf.EmailSMTPHost,
        SMTPPort: globalConf.EmailSMTPPort,
        Username: globalConf.EmailUsername,
        Password: globalConf.EmailPassword,
        From: globalConf.EmailFrom,
        To: globalConf.EmailTo,
        Encrypt: globalConf.EmailEncrypt,
      });
      if (resp && resp.ok) {
        if ($result) $result.textContent = i18n({
          "en": `last test: success · ${absoluteTime(Math.floor(Date.now() / 1000))}`,
          "zh-cn": `上次测试：成功 · ${absoluteTime(Math.floor(Date.now() / 1000))}`,
        });
        showMessage({
          content: i18n({
            "en": "Test email sent, please check the inbox (and the spam folder)",
            "zh-cn": "测试邮件已发送，请检查收件箱（含垃圾邮件）",
          }),
          type: "success",
          duration: 5000,
        });
      } else {
        const msg = friendlyError(resp && resp.msg ? resp.msg : resp);
        if ($result) $result.textContent = i18n({
          "en": `last test: failed · ${msg}`,
          "zh-cn": `上次测试：失败 · ${msg}`,
        });
        showMessage({
          content: msg || i18n({
            "en": "Failed to send the test email",
            "zh-cn": "测试邮件发送失败",
          }),
          type: "error",
          duration: 8000,
        });
      }
    } catch (err) {
      const msg = friendlyError(err);
      if ($result) $result.textContent = i18n({
        "en": `last test: failed · ${msg}`,
        "zh-cn": `上次测试：失败 · ${msg}`,
      });
      showMessage({
        content: msg,
        type: "error",
        duration: 6000,
      });
    } finally {
      $btn.disabled = false;
    }
  });

  // 测试正则表达式
  const $ipv6Reg = document.getElementById("Ipv6Reg");
  const ipv6RegTooltip = new Tooltip($ipv6Reg, ['manual', 'focus']);
  // ipv6网卡信息
  const $ipv6NetInterface = document.getElementById("Ipv6NetInterface");
  const ipv6Dict = Array.from($ipv6NetInterface.options).reduce((acc, option) => {
    // 支持 IPv4-mapped IPv6，例如 ::ffff:192.168.1.102
    const ipv6s = option.innerText.match(/([0-9a-fA-F:.]{2,})/g);
    if (ipv6s) {
      acc[option.value] = ipv6s;
    }
    return acc;
  }, {});
  $ipv6Reg.addEventListener('input', e => {
    // 为空时不处理
    if (!$ipv6Reg.value) {
      ipv6RegTooltip.hide();
      return;
    }
    const curIpv6s = ipv6Dict[$ipv6NetInterface.value] || [];
    // 指定第N个ipv6地址
    const ipv6IndexMatch = $ipv6Reg.value.match(/^@(\d+)$/);
    if (ipv6IndexMatch) {
      const idx = parseInt(ipv6IndexMatch[1]) - 1;
      if (idx < 0 || idx >= curIpv6s.length) {
        ipv6RegTooltip.show({
          title: i18n({
            "en": "<span style='color: red'>Index out of range</span>",
            "zh-cn": "<span style='color: red'>索引超出范围</span>",
          }),
          html: true,
          placement: "top",
        });
        return;
      }
      ipv6RegTooltip.show({
        title: i18n({
          "en": `Matched: ${curIpv6s[idx]}`,
          "zh-cn": `匹配到: ${curIpv6s[idx]}`,
        }),
        placement: "top",
      });
      return;
    }

    // 检测正则表达式是否合法
    let reg;
    try {
      reg = new RegExp($ipv6Reg.value);
    } catch (err) {
      ipv6RegTooltip.show({
        title: i18n({
          "en": "<span style='color: red'>Invalid regular expression</span>",
          "zh-cn": "<span style='color: red'>无效的正则表达式</span>",
        }),
        html: true,
        placement: "top",
      });
      return;
    }
    // 显示正则表达式的匹配结果
    for (const ipv6 of curIpv6s) {
      if (reg.test(ipv6)) {
        ipv6RegTooltip.show({
          title: i18n({
            "en": `Matched: ${ipv6}`,
            "zh-cn": `匹配到: ${ipv6}`,
          }),
          placement: "top",
        });
        return;
      }
    }
    ipv6RegTooltip.show({
      title: i18n({
        "en": "<span style='color: red'>No match found</span>",
        "zh-cn": "<span style='color: red'>无匹配项</span>",
      }),
      html: true,
      placement: "top",
    });
  });
</script>

</html>
